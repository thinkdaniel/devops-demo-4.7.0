version: 2.1

commands:
  install_snyk:
    steps:
      - run:
          name: Install Snyk CLI
          environment:
            SNYK_CLI_VERSION: 1.1308.1
          command: |
            set -euo pipefail
            download_dir=$(mktemp -d)
            trap 'rm -f "$download_dir/snyk-linux" "$download_dir/snyk-linux.sha256"; rmdir "$download_dir"' EXIT
            cd "$download_dir"
            base_url="https://downloads.snyk.io/cli/v${SNYK_CLI_VERSION}"
            curl --fail --show-error --location --retry 6 --output snyk-linux "$base_url/snyk-linux"
            curl --fail --show-error --location --retry 6 --output snyk-linux.sha256 "$base_url/snyk-linux.sha256"
            sha256sum -c snyk-linux.sha256
            sudo install -m 0755 snyk-linux /usr/local/bin/snyk

jobs:
  # ==========================================
  # BUILD JOB - Compile and package
  # ==========================================
  build:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Install dependencies and build
          command: |
            echo "Building the application..."
            mvn clean install -DskipTests

      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}

      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar

  # ==========================================
  # TEST JOB - Run automated tests
  # ==========================================
  test:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Run tests
          command: |
            echo "Running tests..."
            mvn test

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports

  # ==========================================
  # SNYK_SCAN JOB - Snyk: scan Maven dependencies
  # ==========================================
  snyk_scan:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-
      - run:
          name: Verify Snyk token is available
          command: |
            if [ -z "${SNYK_TOKEN:-}" ]; then
              echo "ERROR: SNYK_TOKEN is unset or empty in this job." >&2
              exit 1
            fi
            echo "SNYK_TOKEN is present."
      - install_snyk
      - run:
          name: Scan Maven dependencies with Snyk
          command: snyk test --severity-threshold=high

  # ==========================================
  # SNYK_CODE JOB - Snyk Code: static analysis (SAST) of src/
  # ==========================================
  snyk_code:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Verify Snyk token is available
          command: |
            if [ -z "${SNYK_TOKEN:-}" ]; then
              echo "ERROR: SNYK_TOKEN is unset or empty in this job." >&2
              exit 1
            fi
            echo "SNYK_TOKEN is present."
      - install_snyk
      - run:
          name: Scan source code with Snyk Code
          command: snyk code test --severity-threshold=high

  # ==========================================
  # PUBLISH JOB - Build and push Docker image
  # ==========================================
  publish:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - attach_workspace:
          at: .

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: |
            echo "Building Docker image..."
            docker build -t $DOCKER_USERNAME/devops-demo:latest .

      - run:
          name: Push to Docker Hub
          command: |
            echo "Logging in to Docker Hub..."
            echo $DOCKER_TOKEN | docker login -u $DOCKER_USERNAME --password-stdin
            echo "Pushing image to Docker Hub..."
            docker push $DOCKER_USERNAME/devops-demo:latest

  # ==========================================
  # DEPLOY JOB - Tell Railway to redeploy
  # ==========================================
  deploy:
    docker:
      - image: cimg/node:lts
    steps:
      - run:
          name: Redeploy latest image on Railway
          command: |
            echo "Asking Railway to redeploy the latest image..."
            npx --yes @railway/cli redeploy --service "$RAILWAY_SERVICE_ID" --yes
            echo "Railway is now pulling $DOCKER_USERNAME/devops-demo:latest from Docker Hub."

# ==========================================
# WORKFLOW - Run jobs in sequence
# ==========================================
workflows:
  build_test_publish:
    jobs:
      - build
      - snyk_scan
      - snyk_code
      - test:
          requires:
            - build
      - publish:
          context: docker-hub
          requires:
            - test
            - snyk_scan
            - snyk_code
      - deploy:
          requires:
            - publish
